services:
  - type: web
    name: flex
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --prefix backend && npm ci --prefix frontend && npm run build --prefix frontend
    startCommand: npm start --prefix backend
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: GENERATE_SOURCEMAP
        value: "false"
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        sync: false
      - key: REACT_APP_API_URL
        value: /api
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: REACT_APP_RAZORPAY_KEY_ID
        sync: false
      - key: EMAIL_API_KEY
        sync: false
      - key: FROM_EMAIL
        sync: false
